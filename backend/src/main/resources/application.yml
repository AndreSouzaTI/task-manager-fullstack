spring:
  application:
    name: task-manager-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasks}
    username: ${DB_USERNAME:tasks}
    password: ${DB_PASSWORD:tasks}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  jwt:
    # Em produção, defina JWT_SECRET com pelo menos 32 caracteres
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: task-manager-api
    expiration: ${JWT_EXPIRATION:8h}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
