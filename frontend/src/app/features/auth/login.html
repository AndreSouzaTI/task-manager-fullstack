<main class="auth">
  <form class="auth__card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Task Manager</h1>
    <p class="auth__subtitle">Entre para organizar suas tarefas</p>

    <label>
      E-mail
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field-error">Informe um e-mail válido</span>
      }
    </label>

    <label>
      Senha
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">Informe sua senha</span>
      }
    </label>

    @if (error()) {
      <p class="alert" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn btn--primary" [disabled]="loading()">
      {{ loading() ? 'Entrando...' : 'Entrar' }}
    </button>

    <p class="auth__switch">Ainda não tem conta? <a routerLink="/register">Cadastre-se</a></p>
  </form>
</main>
