<main class="auth">
  <form class="auth__card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Criar conta</h1>
    <p class="auth__subtitle">Leva menos de um minuto</p>

    <label>
      Nome
      <input type="text" formControlName="name" autocomplete="name" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <span class="field-error">Informe seu nome</span>
      }
    </label>

    <label>
      E-mail
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field-error">Informe um e-mail válido</span>
      }
    </label>

    <label>
      Senha
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">Mínimo de 8 caracteres</span>
      }
    </label>

    @if (error()) {
      <p class="alert" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn btn--primary" [disabled]="loading()">
      {{ loading() ? 'Criando conta...' : 'Criar conta' }}
    </button>

    <p class="auth__switch">Já tem conta? <a routerLink="/login">Entrar</a></p>
  </form>
</main>
